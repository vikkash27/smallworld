elvetica,sans-serif" font-size="11" font-weight="700" fill="#55555d" text-anchor="start" letter-spacing="1">FIRST ACTIVITY · CONFIRMED BY HOST</text><text x="85" y="455" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#111113" text-anchor="start">Bring one deployment problem.</text><text x="85" y="489" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#55555d" text-anchor="start">A 30-minute session. Everyone brings a prototype or a problem.</text><text x="85" y="513" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#55555d" text-anchor="start">Time to be agreed.</text><text x="60" y="595" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#111113" text-anchor="start" letter-spacing="-0.8">3 people joined</text><text x="820" y="595" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#4334f5" text-anchor="end" letter-spacing="1.2">ACTIVE</text><circle cx="83" cy="643" r="23" fill="#111113"/><text x="83" y="648" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">VS</text><text x="123" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111113" text-anchor="start">Vikkash</text><text x="820" y="648" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#55555d" text-anchor="end">Host</text><line x1="60" y1="677" x2="850" y2="677" stroke="#dedee5"/><circle cx="83" cy="721" r="23" fill="#111113"/><text x="83" y="726" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AO</text><text x="123" y="726" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111113" text-anchor="start">Amara</text><text x="820" y="726" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#55555d" text-anchor="end">Joined</text><line x1="60" y1="755" x2="850" y2="755" stroke="#dedee5"/><circle cx="83" cy="799" r="23" fill="#111113"/><text x="83" y="804" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">LM</text><text x="123" y="804" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111113" text-anchor="start">Leo</text><text x="820" y="804" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#55555d" text-anchor="end">Joined</text><line x1="60" y1="833" x2="850" y2="833" stroke="#dedee5"/><text x="60" y="902" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#55555d" text-anchor="start">Nina is invited. Pending invitations do not count as members.</text><text x="970" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#55555d" text-anchor="start" letter-spacing="1.1">RECIPIENT VIEW · BEFORE JOINING</text><rect x="965" y="166" width="415" height="752" rx="35" fill="#18181c"/><rect x="977" y="179" width="391" height="726" rx="26" fill="#ffffff"/><rect x="1110" y="187" width="127" height="12" rx="6" fill="#18181c"/><text x="1002" y="240" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#111113" text-anchor="start" letter-spacing="-1">smallworld↗</text><text x="1002" y="286" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#55555d" text-anchor="start">An invitation from Vikkash</text><text x="1002" y="337" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800" fill="#111113" text-anchor="start">Build something</text><text x="1002" y="376" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800" fill="#111113" text-anchor="start">together.</text><text x="1002" y="445" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111113" text-anchor="start">Robotics Build Circle</text><text x="1002" y="478" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#55555d" text-anchor="start">A small group working on practical</text><text x="1002" y="501" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#55555d" text-anchor="start">warehouse robotics.</text><rect x="1002" y="534" width="341" height="114" rx="10" fill="#f2f2f6"/><text x="1018" y="561" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#55555d" text-anchor="start" letter-spacing="1">FIRST ACTIVITY</text><text x="1018" y="590" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#111113" text-anchor="start">Bring one deployment problem.</text><text x="1018" y="615" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#111113" text-anchor="start">Time to be agreed.</text><rect x="1002" y="676" width="18" height="18" rx="3" fill="#ffffff" stroke="#dedee5"/><text x="1031" y="690" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#55555d" text-anchor="start">Show my name on the circle roster</text><rect x="1002" y="732" width="341" height="50" rx="7" fill="#4334f5"/><text x="1022" y="763" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Join this circle</text><text x="1320" y="763" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="end">↗</text><text x="1172" y="819" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#55555d" text-anchor="middle">Not this time</text><text x="1172" y="861" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#55555d" text-anchor="middle">Your chats stay private.</text><line x1="60" y1="974" x2="1380" y2="974" stroke="#dedee5"/><text x="60" y="1000" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#55555d" text-anchor="start">D · CIRCLE CREATION, INVITATIONS &amp; PARTICIPATION</text><text x="1380" y="1000" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#55555d" text-anchor="end" letter-spacing="1">FICTIONAL DATA · VISUAL CONCEPT</text></svg>